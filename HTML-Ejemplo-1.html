<!DOCTYPE html><!--Doctype html es el inicio de todo documento html y dentro de este se tendra todo el codigo necesario.-->
    <html lang="es"><!--Aqui lang, significa language y se define el lenguaje base que va a usar el codigo.-->
    <head><!--En head, se define principalmente la base de lo que sera el codigo y como esta configurado.-->
        <meta charset="UTF-8"><!--Esto funciona para definir el tipo de codificacion que se va a usar, en este caso el UTF 8 que es el mas versatil para evitar errores.-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"><!--Aqui se define las caracteristicas que va a tener el texrto que se imprimira dentro del documento.-->
        <title>Document</title>
    </head>
    <body><!--En body se escribe todo lo que es codigo, tanto para visualizar dentro de la consola o en la cara del documento.-->
    </body>
</html>
